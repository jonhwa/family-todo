<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Family To-Do</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f7f7f5;
      --surface:   #ffffff;
      --border:    #e8e8e4;
      --accent:    #5b8dee;
      --accent-dk: #3a6fd8;
      --done-col:  #b0b0a8;
      --danger:    #e05252;
      --text:      #1a1a1a;
      --text-sub:  #888880;
      --radius:    14px;
      --shadow:    0 2px 12px rgba(0,0,0,.07);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 28px 4px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -.03em;
      flex: 1;
    }
    .sync-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #4cd964;
      transition: background .4s;
      flex-shrink: 0;
    }
    .sync-dot.syncing { background: #ffcc00; }
    .sync-dot.error   { background: var(--danger); }

    /* ── Add form ── */
    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }
    .add-form input {
      flex: 1;
      height: 52px;
      padding: 0 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    .add-form input:focus { border-color: var(--accent); }
    .add-form input::placeholder { color: var(--text-sub); }
    .add-form button {
      width: 52px; height: 52px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .add-form button:active { background: var(--accent-dk); transform: scale(.95); }

    /* ── Section labels ── */
    .section-label {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-sub);
      padding: 0 4px 8px;
    }

    /* ── Item list ── */
    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px 14px 16px;
      box-shadow: var(--shadow);
      transition: opacity .2s, transform .2s;
      animation: slideIn .18s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .item.done-item {
      opacity: .55;
      background: #fafaf8;
      box-shadow: none;
    }

    /* Custom checkbox */
    .check-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .check-btn:active { transform: scale(.88); }
    .check-btn.checked {
      background: #4cd964;
      border-color: #4cd964;
    }
    .check-btn.checked::after {
      content: '';
      width: 8px; height: 5px;
      border-left: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) translate(1px,-1px);
      display: block;
    }

    /* Item text */
    .item-text {
      flex: 1;
      font-size: 1.05rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .done-item .item-text {
      text-decoration: line-through;
      color: var(--done-col);
    }

    /* Delete button */
    .del-btn {
      width: 36px; height: 36px;
      border: none;
      background: transparent;
      color: #ccc;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      flex-shrink: 0;
      transition: color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .del-btn:active { color: var(--danger); background: #fff0f0; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: .95rem;
    }
    .empty .emoji { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    /* ── Footer ── */
    footer {
      margin-top: auto;
      padding: 16px 4px;
      font-size: .78rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🏠 Family To-Do</h1>
    <div class="sync-dot" id="syncDot" title="Live sync"></div>
  </header>

  <form class="add-form" id="addForm">
    <input type="text" id="newItem" placeholder="Add something…" autocomplete="off"
           autocorrect="off" spellcheck="false" maxlength="200" />
    <button type="submit" aria-label="Add item">+</button>
  </form>

  <div id="todoSection">
    <div class="section-label">To Do</div>
    <ul class="list" id="todoList"></ul>
  </div>

  <div id="doneSection" style="display:none">
    <div class="section-label">Done</div>
    <ul class="list" id="doneList"></ul>
  </div>

  <footer>Updates every few seconds · shared between devices</footer>
</div>

<script>
  const todoList  = document.getElementById('todoList');
  const doneList  = document.getElementById('doneList');
  const doneSection = document.getElementById('doneSection');
  const syncDot   = document.getElementById('syncDot');
  const addForm   = document.getElementById('addForm');
  const newItemEl = document.getElementById('newItem');

  let items = [];
  let lastTs = 0;
  let lastN  = -1;

  // ── Render ──────────────────────────────────────────────────────────────
  function render(data) {
    items = data;
    const todo = data.filter(i => !i.done);
    const done = data.filter(i => i.done);

    renderList(todoList, todo);
    renderList(doneList, done);

    doneSection.style.display = done.length ? '' : 'none';

    if (todo.length === 0 && done.length === 0) {
      todoList.innerHTML = '<li class="empty"><span class="emoji">✅</span>Nothing left to do!</li>';
    }
  }

  function renderList(el, arr) {
    // Preserve existing nodes where possible to avoid flicker
    const existing = {};
    el.querySelectorAll('[data-id]').forEach(n => existing[n.dataset.id] = n);

    const newIds = new Set(arr.map(i => String(i.id)));

    // Remove stale
    Object.keys(existing).forEach(id => {
      if (!newIds.has(id)) existing[id].remove();
    });

    // Insert / update
    arr.forEach((item, idx) => {
      const id = String(item.id);
      let node = existing[id];
      if (!node) {
        node = makeItem(item);
        el.appendChild(node);
      } else {
        // update text & check state if changed
        const textEl = node.querySelector('.item-text');
        const checkBtn = node.querySelector('.check-btn');
        if (textEl.textContent !== item.text) textEl.textContent = item.text;
        const isDone = !!item.done;
        if (checkBtn.classList.contains('checked') !== isDone) {
          checkBtn.classList.toggle('checked', isDone);
          node.classList.toggle('done-item', isDone);
        }
      }
    });

    if (arr.length === 0) el.innerHTML = '';
  }

  function makeItem(item) {
    const li = document.createElement('li');
    li.className = 'item' + (item.done ? ' done-item' : '');
    li.dataset.id = item.id;

    const check = document.createElement('button');
    check.className = 'check-btn' + (item.done ? ' checked' : '');
    check.setAttribute('aria-label', item.done ? 'Mark undone' : 'Mark done');
    check.addEventListener('click', () => toggleDone(item.id, !item.done));

    const text = document.createElement('span');
    text.className = 'item-text';
    text.textContent = item.text;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.setAttribute('aria-label', 'Delete');
    del.textContent = '×';
    del.addEventListener('click', () => deleteItem(item.id));

    li.append(check, text, del);
    return li;
  }

  // ── API calls ────────────────────────────────────────────────────────────
  async function fetchItems() {
    setSyncing(true);
    try {
      const r = await fetch('/api/items');
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      render(data);
      if (data.length) lastTs = Math.max(...data.map(i => i.updated));
      lastN = data.length;
      setSyncing(false);
    } catch(e) {
      setError();
    }
  }

  async function addItem(text) {
    const r = await fetch('/api/items', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text })
    });
    if (!r.ok) throw new Error(r.status);
    await fetchItems();
  }

  async function toggleDone(id, done) {
    const node = document.querySelector(`[data-id="${id}"]`);
    if (node) {
      const checkBtn = node.querySelector('.check-btn');
      checkBtn.classList.toggle('checked', done);
      node.classList.toggle('done-item', done);
    }
    await fetch(`/api/items/${id}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ done })
    });
    await fetchItems();
  }

  async function deleteItem(id) {
    const node = document.querySelector(`[data-id="${id}"]`);
    if (node) node.style.transform = 'translateX(30px)';
    setTimeout(async () => {
      await fetch(`/api/items/${id}`, { method: 'DELETE' });
      await fetchItems();
    }, 120);
  }

  // ── Polling ───────────────────────────────────────────────────────────────
  async function poll() {
    try {
      const r = await fetch('/api/poll');
      if (!r.ok) return;
      const { ts, n } = await r.json();
      if (ts !== lastTs || n !== lastN) {
        await fetchItems();
      } else {
        setSyncing(false);
      }
    } catch(e) {
      setError();
    }
  }

  function setSyncing(active) {
    syncDot.className = 'sync-dot' + (active ? ' syncing' : '');
  }
  function setError() {
    syncDot.className = 'sync-dot error';
  }

  setInterval(poll, 3000);

  // ── Form ─────────────────────────────────────────────────────────────────
  addForm.addEventListener('submit', async e => {
    e.preventDefault();
    const text = newItemEl.value.trim();
    if (!text) return;
    newItemEl.value = '';
    try {
      await addItem(text);
    } catch(e) {
      setError();
    }
  });

  // ── Boot ─────────────────────────────────────────────────────────────────
  fetchItems();
</script>
</body>
</html>

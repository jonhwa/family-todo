<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Family To-Do</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #f7f7f5;
      --surface:     #ffffff;
      --border:      #e8e8e4;
      --accent:      #5b8dee;
      --accent-dk:   #3a6fd8;
      --done-col:    #b0b0a8;
      --danger:      #e05252;
      --high-bg:     #fff1f1;
      --high-color:  #c0392b;
      --high-border: #f5c6c6;
      --warn-bg:     #fffbeb;
      --warn-border: #fde68a;
      --over-bg:     #fff5f5;
      --over-border: #fecaca;
      --text:        #1a1a1a;
      --text-sub:    #888880;
      --radius:      14px;
      --shadow:      0 2px 12px rgba(0,0,0,.07);
    }
    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 28px 4px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.03em; flex: 1; }
    .sync-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #4cd964;
      transition: background .4s; flex-shrink: 0;
    }
    .sync-dot.syncing { background: #ffcc00; }
    .sync-dot.error   { background: var(--danger); }

    /* ── Add form ── */
    .add-form {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .add-row { display: flex; gap: 10px; }
    .add-form input[type="text"] {
      flex: 1; height: 48px; padding: 0 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 1rem; background: var(--bg); color: var(--text);
      outline: none; transition: border-color .2s; -webkit-appearance: none;
    }
    .add-form input[type="text"]:focus { border-color: var(--accent); }
    .add-form input[type="text"]::placeholder { color: var(--text-sub); }
    .add-form button[type="submit"] {
      width: 48px; height: 48px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: 1.6rem; line-height: 1;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .add-form button[type="submit"]:active { background: var(--accent-dk); transform: scale(.95); }

    /* ── Priority toggle in form ── */
    .form-options { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .priority-btns { display: flex; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border); flex-shrink: 0; }
    .priority-btn {
      padding: 6px 14px; font-size: .82rem; font-weight: 600;
      border: none; background: var(--bg); color: var(--text-sub);
      cursor: pointer; transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: .01em;
    }
    .priority-btn + .priority-btn { border-left: 1.5px solid var(--border); }
    .priority-btn.active-high { background: var(--high-bg); color: var(--high-color); }
    .priority-btn.active-low  { background: #f0f4ff; color: var(--accent-dk); }

    /* ── Deadline row ── */
    .deadline-toggle {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .deadline-toggle input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0;
    }
    .deadline-toggle span { font-size: .88rem; color: var(--text-sub); }
    .deadline-picker { display: none; flex: 1; }
    .deadline-picker.visible { display: block; }
    .deadline-picker input[type="date"] {
      width: 100%; height: 36px; padding: 0 10px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: .9rem; color: var(--text); background: var(--bg);
      outline: none; -webkit-appearance: none; transition: border-color .2s;
    }
    .deadline-picker input[type="date"]:focus { border-color: var(--accent); }

    /* ── Section labels ── */
    .section-label {
      font-size: .72rem; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-sub); padding: 0 4px 8px;
    }

    /* ── Item list ── */
    .list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .item {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 12px 12px 12px 14px;
      box-shadow: var(--shadow); transition: opacity .2s, transform .2s;
      animation: slideIn .18s ease;
    }
    @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .item.high-priority { border-left: 3px solid var(--high-color); }
    .item.approaching   { background: var(--warn-bg); border-color: var(--warn-border); }
    .item.overdue       { background: var(--over-bg); border-color: var(--over-border); }
    .item.high-priority.approaching { border-left-color: #e67e22; }
    .item.high-priority.overdue     { border-left-color: var(--danger); }
    .item.done-item { opacity: .5; background: #fafaf8; border-color: var(--border); box-shadow: none; border-left-width: 1.5px; }

    /* ── Checkbox ── */
    .check-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2.5px solid var(--border); background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .check-btn:active { transform: scale(.88); }
    .check-btn.checked { background: #4cd964; border-color: #4cd964; }
    .check-btn.checked::after {
      content: ''; width: 8px; height: 5px;
      border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) translate(1px,-1px); display: block;
    }

    /* ── Item body ── */
    .item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .item-text { font-size: 1rem; line-height: 1.4; word-break: break-word; }
    .done-item .item-text { text-decoration: line-through; color: var(--done-col); }
    .item-badges { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }

    /* Priority badge (clickable) */
    .pri-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: .72rem; font-weight: 600; border-radius: 5px;
      padding: 2px 7px; cursor: pointer; border: 1.5px solid transparent;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .pri-badge:active { transform: scale(.93); }
    .pri-badge.high { background: var(--high-bg); color: var(--high-color); border-color: var(--high-border); }
    .pri-badge.low  { background: #f4f4f2; color: #999; border-color: #e0e0db; }
    .done-item .pri-badge { pointer-events: none; opacity: .5; }

    /* Deadline badge */
    .dl-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: .72rem; font-weight: 500; border-radius: 5px;
      padding: 2px 7px; background: #f0f4ff; color: #4a6fa5; border: 1px solid #d5e0f5;
    }
    .dl-badge.approaching { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .dl-badge.overdue     { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .done-item .dl-badge  { opacity: .5; }

    /* ── Delete button ── */
    .del-btn {
      width: 34px; height: 34px; border: none; background: transparent;
      color: #ccc; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px; flex-shrink: 0; margin-top: -1px;
      transition: color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .del-btn:active { color: var(--danger); background: #fff0f0; }

    /* ── Empty / footer ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: .95rem; }
    .empty .emoji { font-size: 2.5rem; display: block; margin-bottom: 10px; }
    footer { margin-top: auto; padding: 16px 4px; font-size: .78rem; color: var(--text-sub); text-align: center; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>&#127968; Family To-Do</h1>
    <div class="sync-dot" id="syncDot"></div>
  </header>

  <form class="add-form" id="addForm">
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Add something..." autocomplete="off"
             autocorrect="off" spellcheck="false" maxlength="200" />
      <button type="submit" aria-label="Add item">+</button>
    </div>
    <div class="form-options">
      <div class="priority-btns" role="group" aria-label="Priority">
        <button type="button" class="priority-btn" id="btnHigh" data-p="high">&#9650; High</button>
        <button type="button" class="priority-btn active-low" id="btnLow"  data-p="low">Low</button>
      </div>
      <label class="deadline-toggle">
        <input type="checkbox" id="deadlineCheck" />
        <span>Set deadline</span>
      </label>
      <div class="deadline-picker" id="deadlinePicker">
        <input type="date" id="deadlineDate" />
      </div>
    </div>
  </form>

  <div id="todoSection">
    <div class="section-label">To Do</div>
    <ul class="list" id="todoList"></ul>
  </div>
  <div id="doneSection" style="display:none">
    <div class="section-label">Done</div>
    <ul class="list" id="doneList"></ul>
  </div>

  <footer>Updates every few seconds &middot; shared between devices</footer>
</div>

<script>
  var todoList    = document.getElementById('todoList');
  var doneList    = document.getElementById('doneList');
  var doneSection = document.getElementById('doneSection');
  var syncDot     = document.getElementById('syncDot');
  var addForm     = document.getElementById('addForm');
  var newItemEl   = document.getElementById('newItem');
  var btnHigh     = document.getElementById('btnHigh');
  var btnLow      = document.getElementById('btnLow');
  var deadlineCheck  = document.getElementById('deadlineCheck');
  var deadlinePicker = document.getElementById('deadlinePicker');
  var deadlineDate   = document.getElementById('deadlineDate');

  var selectedPriority = 'low';
  var lastTs = 0;
  var lastN  = -1;

  // ── Priority toggle buttons in form ──────────────────────────────────────
  function setPriority(p) {
    selectedPriority = p;
    btnHigh.className = 'priority-btn' + (p === 'high' ? ' active-high' : '');
    btnLow.className  = 'priority-btn' + (p === 'low'  ? ' active-low'  : '');
  }
  btnHigh.addEventListener('click', function() { setPriority('high'); });
  btnLow.addEventListener('click',  function() { setPriority('low');  });

  // ── Deadline toggle ───────────────────────────────────────────────────────
  deadlineCheck.addEventListener('change', function() {
    deadlinePicker.classList.toggle('visible', deadlineCheck.checked);
    if (deadlineCheck.checked) { deadlineDate.focus(); }
    else { deadlineDate.value = ''; }
  });

  // ── Deadline helpers ──────────────────────────────────────────────────────
  function deadlineStatus(deadline) {
    if (!deadline) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var due   = new Date(deadline + 'T00:00:00');
    var diff  = Math.round((due - today) / 86400000);
    if (diff < 0)  return 'overdue';
    if (diff <= 2) return 'approaching';
    return 'normal';
  }

  function formatDeadline(deadline, status) {
    if (!deadline) return '';
    var due   = new Date(deadline + 'T00:00:00');
    var today = new Date(); today.setHours(0,0,0,0);
    var diff  = Math.round((due - today) / 86400000);
    var label;
    if      (diff === 0)  label = 'Today';
    else if (diff === 1)  label = 'Tomorrow';
    else if (diff === -1) label = 'Yesterday';
    else if (diff < -1)   label = Math.abs(diff) + 'd overdue';
    else label = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var prefix = status === 'overdue' ? '⚠️ ' : status === 'approaching' ? '🔔 ' : '📅 ';
    return prefix + label;
  }

  // ── Build CSS classes ─────────────────────────────────────────────────────
  function itemClass(item, dlStatus) {
    var cls = 'item';
    if (item.done) return cls + ' done-item';
    if (item.priority === 'high') cls += ' high-priority';
    if (dlStatus === 'overdue')      cls += ' overdue';
    else if (dlStatus === 'approaching') cls += ' approaching';
    return cls;
  }
  function dlBadgeClass(status) {
    return 'dl-badge' + (status === 'overdue' ? ' overdue' : status === 'approaching' ? ' approaching' : '');
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function render(data) {
    var todo = [], done = [];
    for (var i = 0; i < data.length; i++) {
      (data[i].done ? done : todo).push(data[i]);
    }
    renderList(todoList, todo);
    renderList(doneList, done);
    doneSection.style.display = done.length ? '' : 'none';
    if (todo.length === 0 && done.length === 0) {
      todoList.innerHTML = '<li class="empty"><span class="emoji">&#9989;</span>Nothing left to do!</li>';
    }
  }

  function renderList(el, arr) {
    var existing = {}, nodes = el.querySelectorAll('[data-id]');
    for (var i = 0; i < nodes.length; i++) existing[nodes[i].dataset.id] = nodes[i];
    var newIds = {};
    for (var i = 0; i < arr.length; i++) newIds[String(arr[i].id)] = true;
    Object.keys(existing).forEach(function(id) { if (!newIds[id]) existing[id].remove(); });
    for (var i = 0; i < arr.length; i++) {
      var item = arr[i];
      var id   = String(item.id);
      var dls  = item.done ? null : deadlineStatus(item.deadline);
      var node = existing[id];
      if (!node) { node = makeItem(item, dls); el.appendChild(node); }
      else        updateItemNode(node, item, dls);
    }
    if (arr.length === 0) el.innerHTML = '';
  }

  function makeItem(item, dls) {
    var li = document.createElement('li');
    li.dataset.id = item.id;
    li.className  = itemClass(item, dls);

    var check = document.createElement('button');
    check.type = 'button';
    check.className = 'check-btn' + (item.done ? ' checked' : '');
    check.setAttribute('aria-label', item.done ? 'Mark undone' : 'Mark done');
    (function(id, done) {
      check.addEventListener('click', function() { toggleDone(id, !done); });
    })(item.id, !!item.done);

    var body = document.createElement('div');
    body.className = 'item-body';

    var textEl = document.createElement('span');
    textEl.className = 'item-text';
    textEl.textContent = item.text;
    body.appendChild(textEl);

    var badges = document.createElement('div');
    badges.className = 'item-badges';

    var priBadge = document.createElement('span');
    priBadge.className = 'pri-badge ' + item.priority;
    priBadge.textContent = item.priority === 'high' ? '▲ High' : 'Low';
    priBadge.title = 'Click to toggle priority';
    (function(id, cur) {
      priBadge.addEventListener('click', function() {
        togglePriority(id, cur === 'high' ? 'low' : 'high');
      });
    })(item.id, item.priority);
    badges.appendChild(priBadge);

    if (item.deadline) {
      var dlBadge = document.createElement('span');
      dlBadge.className = dlBadgeClass(dls);
      dlBadge.textContent = formatDeadline(item.deadline, dls);
      badges.appendChild(dlBadge);
    }

    body.appendChild(badges);

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del-btn';
    del.setAttribute('aria-label', 'Delete');
    del.textContent = '×';
    (function(id) {
      del.addEventListener('click', function() { deleteItem(id); });
    })(item.id);

    li.append(check, body, del);
    return li;
  }

  function updateItemNode(node, item, dls) {
    node.className = itemClass(item, dls);
    var check = node.querySelector('.check-btn');
    check.classList.toggle('checked', !!item.done);

    var textEl = node.querySelector('.item-text');
    if (textEl.textContent !== item.text) textEl.textContent = item.text;

    var badges = node.querySelector('.item-badges');

    var priBadge = badges.querySelector('.pri-badge');
    if (priBadge) {
      priBadge.className = 'pri-badge ' + item.priority;
      priBadge.textContent = item.priority === 'high' ? '▲ High' : 'Low';
      (function(id, cur) {
        priBadge.onclick = function() { togglePriority(id, cur === 'high' ? 'low' : 'high'); };
      })(item.id, item.priority);
    }

    var dlBadge = badges.querySelector('.dl-badge');
    if (item.deadline) {
      if (!dlBadge) { dlBadge = document.createElement('span'); badges.appendChild(dlBadge); }
      dlBadge.className   = dlBadgeClass(dls);
      dlBadge.textContent = formatDeadline(item.deadline, dls);
    } else if (dlBadge) {
      dlBadge.remove();
    }
  }

  // ── API helpers ───────────────────────────────────────────────────────────
  function setSyncing(on) { syncDot.className = 'sync-dot' + (on ? ' syncing' : ''); }
  function setError()     { syncDot.className = 'sync-dot error'; }

  function fetchItems() {
    setSyncing(true);
    fetch('/api/items')
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data) {
        render(data);
        if (data.length) lastTs = Math.max.apply(null, data.map(function(i) { return i.updated; }));
        lastN = data.length;
        setSyncing(false);
      })
      .catch(function() { setError(); });
  }

  function toggleDone(id, done) {
    var node = document.querySelector('[data-id="' + id + '"]');
    if (node) { node.querySelector('.check-btn').classList.toggle('checked', done); }
    fetch('/api/items/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: done })
    }).then(function() { fetchItems(); }).catch(function() { setError(); });
  }

  function togglePriority(id, newPriority) {
    fetch('/api/items/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ priority: newPriority })
    }).then(function() { fetchItems(); }).catch(function() { setError(); });
  }

  function deleteItem(id) {
    var node = document.querySelector('[data-id="' + id + '"]');
    if (node) { node.style.transform = 'translateX(30px)'; node.style.opacity = '0'; }
    setTimeout(function() {
      fetch('/api/items/' + id, { method: 'DELETE' })
        .then(function() { fetchItems(); }).catch(function() { setError(); });
    }, 150);
  }

  // ── Polling ───────────────────────────────────────────────────────────────
  function poll() {
    fetch('/api/poll')
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d) {
        if (d.ts !== lastTs || d.n !== lastN) fetchItems();
        else setSyncing(false);
      })
      .catch(function() { setError(); });
  }
  setInterval(poll, 3000);

  // ── Form submit ───────────────────────────────────────────────────────────
  addForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var text = newItemEl.value.trim();
    if (!text) return;
    var deadline = deadlineCheck.checked ? deadlineDate.value : null;
    var priority = selectedPriority;
    newItemEl.value = '';
    setPriority('low');
    deadlineCheck.checked = false;
    deadlinePicker.classList.remove('visible');
    deadlineDate.value = '';
    fetch('/api/items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, deadline: deadline || null, priority: priority })
    }).then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function() { fetchItems(); })
      .catch(function() { setError(); });
  });

  // ── Boot ─────────────────────────────────────────────────────────────────
  fetchItems();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Family To-Do</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f7f7f5;
      --surface:     #ffffff;
      --border:      #e8e8e4;
      --accent:      #5b8dee;
      --accent-dk:   #3a6fd8;
      --done-col:    #b0b0a8;
      --danger:      #e05252;
      --warn:        #f59e0b;
      --warn-bg:     #fffbeb;
      --warn-border: #fde68a;
      --over-bg:     #fff5f5;
      --over-border: #fecaca;
      --text:        #1a1a1a;
      --text-sub:    #888880;
      --radius:      14px;
      --shadow:      0 2px 12px rgba(0,0,0,.07);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 4px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -.03em;
      flex: 1;
    }
    .sync-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #4cd964;
      transition: background .4s;
      flex-shrink: 0;
    }
    .sync-dot.syncing { background: #ffcc00; }
    .sync-dot.error   { background: var(--danger); }

    .add-form {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .add-row {
      display: flex;
      gap: 10px;
    }
    .add-form input[type="text"] {
      flex: 1;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    .add-form input[type="text"]:focus { border-color: var(--accent); }
    .add-form input[type="text"]::placeholder { color: var(--text-sub); }

    .add-form button[type="submit"] {
      width: 48px; height: 48px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .add-form button[type="submit"]:active { background: var(--accent-dk); transform: scale(.95); }

    .deadline-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .deadline-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .deadline-toggle input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .deadline-toggle span {
      font-size: .88rem;
      color: var(--text-sub);
    }
    .deadline-picker {
      display: none;
      flex: 1;
    }
    .deadline-picker.visible { display: block; }
    .deadline-picker input[type="date"] {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      color: var(--text);
      background: var(--bg);
      outline: none;
      -webkit-appearance: none;
      transition: border-color .2s;
    }
    .deadline-picker input[type="date"]:focus { border-color: var(--accent); }

    .section-label {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-sub);
      padding: 0 4px 8px;
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px 14px 16px;
      box-shadow: var(--shadow);
      transition: opacity .2s, transform .2s;
      animation: slideIn .18s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .item.approaching {
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }
    .item.overdue {
      background: var(--over-bg);
      border-color: var(--over-border);
    }
    .item.done-item {
      opacity: .5;
      background: #fafaf8;
      border-color: var(--border);
      box-shadow: none;
    }

    .check-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .check-btn:active { transform: scale(.88); }
    .check-btn.checked {
      background: #4cd964;
      border-color: #4cd964;
    }
    .check-btn.checked::after {
      content: '';
      width: 8px; height: 5px;
      border-left: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) translate(1px,-1px);
      display: block;
    }

    .item-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .item-text {
      font-size: 1.05rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .done-item .item-text {
      text-decoration: line-through;
      color: var(--done-col);
    }

    .deadline-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: .76rem;
      font-weight: 500;
      border-radius: 6px;
      padding: 2px 7px;
      width: fit-content;
      background: #f0f4ff;
      color: #4a6fa5;
      border: 1px solid #d5e0f5;
    }
    .deadline-badge.approaching {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }
    .deadline-badge.overdue {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }
    .done-item .deadline-badge { opacity: .5; }

    .del-btn {
      width: 36px; height: 36px;
      border: none;
      background: transparent;
      color: #ccc;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      flex-shrink: 0;
      margin-top: -2px;
      transition: color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .del-btn:active { color: var(--danger); background: #fff0f0; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: .95rem;
    }
    .empty .emoji { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    footer {
      margin-top: auto;
      padding: 16px 4px;
      font-size: .78rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>&#127968; Family To-Do</h1>
    <div class="sync-dot" id="syncDot" title="Live sync"></div>
  </header>

  <form class="add-form" id="addForm">
    <div class="add-row">
      <input type="text" id="newItem" placeholder="Add something..." autocomplete="off"
             autocorrect="off" spellcheck="false" maxlength="200" />
      <button type="submit" aria-label="Add item">+</button>
    </div>
    <div class="deadline-row">
      <label class="deadline-toggle">
        <input type="checkbox" id="deadlineCheck" />
        <span>Set deadline</span>
      </label>
      <div class="deadline-picker" id="deadlinePicker">
        <input type="date" id="deadlineDate" />
      </div>
    </div>
  </form>

  <div id="todoSection">
    <div class="section-label">To Do</div>
    <ul class="list" id="todoList"></ul>
  </div>

  <div id="doneSection" style="display:none">
    <div class="section-label">Done</div>
    <ul class="list" id="doneList"></ul>
  </div>

  <footer>Updates every few seconds &middot; shared between devices</footer>
</div>

<script>
  var todoList     = document.getElementById('todoList');
  var doneList     = document.getElementById('doneList');
  var doneSection  = document.getElementById('doneSection');
  var syncDot      = document.getElementById('syncDot');
  var addForm      = document.getElementById('addForm');
  var newItemEl    = document.getElementById('newItem');
  var deadlineCheck  = document.getElementById('deadlineCheck');
  var deadlinePicker = document.getElementById('deadlinePicker');
  var deadlineDate   = document.getElementById('deadlineDate');

  deadlineCheck.addEventListener('change', function() {
    deadlinePicker.classList.toggle('visible', deadlineCheck.checked);
    if (deadlineCheck.checked) { deadlineDate.focus(); }
    else { deadlineDate.value = ''; }
  });

  var lastTs = 0;
  var lastN  = -1;

  // ── Deadline helpers ──────────────────────────────────────────────────────

  function deadlineStatus(deadline) {
    if (!deadline) return null;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var due = new Date(deadline + 'T00:00:00');
    var diffDays = Math.round((due - today) / 86400000);
    if (diffDays < 0)  return 'overdue';
    if (diffDays <= 2) return 'approaching';
    return 'normal';
  }

  function formatDeadline(deadline, status) {
    if (!deadline) return '';
    var due = new Date(deadline + 'T00:00:00');
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var diffDays = Math.round((due - today) / 86400000);
    var label;
    if (diffDays === 0)      label = 'Today';
    else if (diffDays === 1) label = 'Tomorrow';
    else if (diffDays === -1) label = 'Yesterday';
    else if (diffDays < -1)  label = Math.abs(diffDays) + 'd overdue';
    else label = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var icon = status === 'overdue' ? 'overdue ' : status === 'approaching' ? 'due ' : '';
    return icon + label;
  }

  // ── Render ────────────────────────────────────────────────────────────────

  function render(data) {
    var todo = data.filter(function(i) { return !i.done; });
    var done = data.filter(function(i) { return i.done; });
    renderList(todoList, todo);
    renderList(doneList, done);
    doneSection.style.display = done.length ? '' : 'none';
    if (todo.length === 0 && done.length === 0) {
      todoList.innerHTML = '<li class="empty"><span class="emoji">&#9989;</span>Nothing left to do!</li>';
    }
  }

  function renderList(el, arr) {
    var existing = {};
    var nodes = el.querySelectorAll('[data-id]');
    for (var i = 0; i < nodes.length; i++) {
      existing[nodes[i].dataset.id] = nodes[i];
    }
    var newIds = {};
    for (var i = 0; i < arr.length; i++) { newIds[String(arr[i].id)] = true; }

    Object.keys(existing).forEach(function(id) {
      if (!newIds[id]) existing[id].remove();
    });

    for (var i = 0; i < arr.length; i++) {
      var item = arr[i];
      var id = String(item.id);
      var status = item.done ? null : deadlineStatus(item.deadline);
      var node = existing[id];
      if (!node) {
        node = makeItem(item, status);
        el.appendChild(node);
      } else {
        updateItemNode(node, item, status);
      }
    }

    if (arr.length === 0) { el.innerHTML = ''; }
  }

  function buildItemClass(item, status) {
    var cls = 'item';
    if (item.done) return cls + ' done-item';
    if (status === 'overdue') cls += ' overdue';
    else if (status === 'approaching') cls += ' approaching';
    return cls;
  }

  function buildBadgeClass(status) {
    var cls = 'deadline-badge';
    if (status === 'overdue') cls += ' overdue';
    else if (status === 'approaching') cls += ' approaching';
    return cls;
  }

  function makeItem(item, status) {
    var li = document.createElement('li');
    li.dataset.id = item.id;
    li.className = buildItemClass(item, status);

    var check = document.createElement('button');
    check.type = 'button';
    check.className = 'check-btn' + (item.done ? ' checked' : '');
    check.setAttribute('aria-label', item.done ? 'Mark undone' : 'Mark done');
    (function(itemId, itemDone) {
      check.addEventListener('click', function() { toggleDone(itemId, !itemDone); });
    })(item.id, !!item.done);

    var body = document.createElement('div');
    body.className = 'item-body';

    var text = document.createElement('span');
    text.className = 'item-text';
    text.textContent = item.text;
    body.appendChild(text);

    if (item.deadline) {
      var badge = document.createElement('span');
      badge.className = buildBadgeClass(status);
      badge.textContent = formatDeadline(item.deadline, status);
      body.appendChild(badge);
    }

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del-btn';
    del.setAttribute('aria-label', 'Delete');
    del.textContent = '×';
    (function(itemId) {
      del.addEventListener('click', function() { deleteItem(itemId); });
    })(item.id);

    li.append(check, body, del);
    return li;
  }

  function updateItemNode(node, item, status) {
    node.className = buildItemClass(item, status);
    var checkBtn = node.querySelector('.check-btn');
    checkBtn.classList.toggle('checked', !!item.done);
    var textEl = node.querySelector('.item-text');
    if (textEl.textContent !== item.text) { textEl.textContent = item.text; }
    var body = node.querySelector('.item-body');
    var badge = body.querySelector('.deadline-badge');
    if (item.deadline) {
      if (!badge) { badge = document.createElement('span'); body.appendChild(badge); }
      badge.className = buildBadgeClass(status);
      badge.textContent = formatDeadline(item.deadline, status);
    } else if (badge) {
      badge.remove();
    }
  }

  // ── API calls ─────────────────────────────────────────────────────────────

  function setSyncing(active) { syncDot.className = 'sync-dot' + (active ? ' syncing' : ''); }
  function setError()         { syncDot.className = 'sync-dot error'; }

  function fetchItems() {
    setSyncing(true);
    fetch('/api/items')
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data) {
        render(data);
        if (data.length) {
          lastTs = Math.max.apply(null, data.map(function(i) { return i.updated; }));
        }
        lastN = data.length;
        setSyncing(false);
      })
      .catch(function() { setError(); });
  }

  function toggleDone(id, done) {
    var node = document.querySelector('[data-id="' + id + '"]');
    if (node) {
      node.querySelector('.check-btn').classList.toggle('checked', done);
      node.classList.toggle('done-item', done);
    }
    fetch('/api/items/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ done: done })
    }).then(function() { fetchItems(); }).catch(function() { setError(); });
  }

  function deleteItem(id) {
    var node = document.querySelector('[data-id="' + id + '"]');
    if (node) { node.style.transform = 'translateX(30px)'; node.style.opacity = '0'; }
    setTimeout(function() {
      fetch('/api/items/' + id, { method: 'DELETE' })
        .then(function() { fetchItems(); })
        .catch(function() { setError(); });
    }, 150);
  }

  // ── Polling ───────────────────────────────────────────────────────────────

  function poll() {
    fetch('/api/poll')
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d) {
        if (d.ts !== lastTs || d.n !== lastN) { fetchItems(); }
        else { setSyncing(false); }
      })
      .catch(function() { setError(); });
  }

  setInterval(poll, 3000);

  // ── Form submit ───────────────────────────────────────────────────────────

  addForm.addEventListener('submit', function(e) {
    e.preventDefault();
    var text = newItemEl.value.trim();
    if (!text) return;
    var deadline = deadlineCheck.checked ? deadlineDate.value : null;
    newItemEl.value = '';
    deadlineCheck.checked = false;
    deadlinePicker.classList.remove('visible');
    deadlineDate.value = '';
    fetch('/api/items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, deadline: deadline || null })
    })
    .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function() { fetchItems(); })
    .catch(function() { setError(); });
  });

  // ── Boot ──────────────────────────────────────────────────────────────────

  fetchItems();
</script>
</body>
</html>
